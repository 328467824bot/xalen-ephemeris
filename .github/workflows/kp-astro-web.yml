name: KP Astro Web Build

# 编译 apps/kp-astro-web/ 这个 XALEN KP 占星 Web 应用，
# 产出静态 JS 文件并作为构建产物（artifact）上传。
#
# 触发条件：
#   - 推送到 main 分支且改动涉及 apps/kp-astro-web/
#   - 任何针对 apps/kp-astro-web/ 的 PR
#   - 手动触发（workflow_dispatch）

on:
  push:
    branches: [main]
    paths:
      - 'apps/kp-astro-web/**'
      - '.github/workflows/kp-astro-web.yml'
  pull_request:
    paths:
      - 'apps/kp-astro-web/**'
      - '.github/workflows/kp-astro-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build KP Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kp-astro-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 只缓存 kp-astro-web 项目的 Gradle 缓存
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile Kotlin/JS
        run: ./gradlew compileKotlinJs --no-daemon --stacktrace

      - name: Run unit tests (Node.js)
        run: ./gradlew nodeTest --no-daemon --stacktrace

      - name: Assemble distribution
        run: ./gradlew assembleDistrib --no-daemon --stacktrace

      - name: Verify distribution files
        run: |
          echo "=== Distribution contents ==="
          ls -la build/distrib/
          echo ""
          echo "=== File sizes ==="
          du -sh build/distrib/*
          echo ""
          # 必须存在这 5 个文件，缺一不可
          for f in index.html kp-astro.js kotlin-kotlin-stdlib.js kotlinx-html.js; do
            if [ ! -f "build/distrib/$f" ]; then
              echo "ERROR: Missing required file: $f"
              exit 1
            fi
            size=$(stat -c%s "build/distrib/$f")
            if [ "$size" -lt 1000 ]; then
              echo "ERROR: $f is too small ($size bytes), build likely failed"
              exit 1
            fi
            echo "OK: $f ($size bytes)"
          done

      - name: Smoke test — start HTTP server & curl
        run: |
          cd build/distrib
          python3 -m http.server 8888 > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          echo "=== Smoke test ==="
          for f in index.html kp-astro.js kotlin-kotlin-stdlib.js kotlinx-html.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8888/$f")
            if [ "$code" != "200" ]; then
              echo "ERROR: HTTP $code for $f"
              kill $SERVER_PID
              exit 1
            fi
            echo "OK: HTTP 200 for $f"
          done
          kill $SERVER_PID

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kp-astro-web-distrib
          path: apps/kp-astro-web/build/distrib/
          retention-days: 30
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kp-astro-web-test-report
          path: apps/kp-astro-web/build/reports/tests/nodeTest/
          retention-days: 14
          if-no-files-found: warn
