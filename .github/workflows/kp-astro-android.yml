name: KP Astro Android APK Build

# 编译 apps/kp-astro-android/ 这个 XALEN KP 占星 Android 应用，
# 产出 debug + release APK 并作为构建产物（artifact）上传。
#
# 触发条件：
#   - 推送到 main 分支且改动涉及 apps/kp-astro-android/
#   - 任何针对 apps/kp-astro-android/ 的 PR
#   - 手动触发（workflow_dispatch）

on:
  push:
    branches: [main]
    paths:
      - 'apps/kp-astro-android/**'
      - '.github/workflows/kp-astro-android.yml'
  pull_request:
    paths:
      - 'apps/kp-astro-android/**'
      - '.github/workflows/kp-astro-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kp-astro-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify keystore exists
        run: |
          if [ ! -f keystore/kp-astro-release.keystore ]; then
            echo "ERROR: keystore file missing"
            exit 1
          fi
          if [ ! -f keystore.properties ]; then
            echo "ERROR: keystore.properties missing"
            exit 1
          fi
          echo "Keystore OK:"
          ls -la keystore/
          cat keystore.properties | sed 's/password=.*/password=***/'

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APKs exist
        run: |
          echo "=== APK files ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -la {} \;
          for variant in debug release; do
            apk="app/build/outputs/apk/$variant/app-$variant.apk"
            if [ ! -f "$apk" ]; then
              echo "ERROR: Missing APK: $apk"
              exit 1
            fi
            size=$(stat -c%s "$apk")
            if [ "$size" -lt 1000000 ]; then
              echo "ERROR: $apk is too small ($size bytes), build likely failed"
              exit 1
            fi
            echo "OK: $apk ($size bytes)"
          done

      - name: Show APK info
        run: |
          echo "=== APK file info ==="
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            echo "--- $apk ---"
            ls -la "$apk"
            # 用 unzip 列出 APK 内容前 10 项
            unzip -l "$apk" 2>/dev/null | head -15
            echo ""
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kp-astro-android-debug-apk
          path: apps/kp-astro-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kp-astro-android-release-apk
          path: apps/kp-astro-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kp-astro-android-build-reports
          path: |
            apps/kp-astro-android/app/build/reports/
            apps/kp-astro-android/app/build/outputs/mapping/
          retention-days: 14
          if-no-files-found: warn
