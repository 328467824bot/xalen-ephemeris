<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover for notch/safe-area; user-scalable=yes for pinch zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0f1419">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>KP 占星</title>
    <style>
        :root {
            --bg: #0f1419;
            --bg-elev: #1a2128;
            --bg-card: #1e2730;
            --bg-card-hover: #232d36;
            --border: #2a3744;
            --border-soft: #364350;
            --text: #e8eef2;
            --text-soft: #9fb0bd;
            --text-muted: #6b7d8c;
            --accent: #d4a574;
            --accent-soft: #b8895d;
            --positive: #4ade80;
            --negative: #f87171;
            --mixed: #facc15;
            --grade-a: #f59e0b;
            --grade-b: #60a5fa;
            --grade-c: #a78bfa;
            --grade-d: #34d399;
            --grade-e: #94a3b8;
            --kp-num: #d4a574;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px);
            --safe-r: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            /* Allow pinch zoom; never break horizontal axis at page level.
               Per-card horizontal scroll handles wide elements (URLs, code). */
            overflow-x: hidden;
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Source Han Sans SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            font-size: 14px;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            /* Allow both pan-x and pan-y so users can scroll horizontally inside
               .table-scroll containers and pinch-zoom freely. */
            overscroll-behavior-x: contain;
            touch-action: pan-x pan-y pinch-zoom;
        }

        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(80px + var(--safe-b)) calc(12px + var(--safe-l));
            width: 100%;
            overflow-x: hidden;
        }

        @media (min-width: 768px) {
            .app-container {
                padding: calc(20px + var(--safe-t)) calc(20px + var(--safe-r)) calc(20px + var(--safe-b)) calc(20px + var(--safe-l));
            }
        }

        .app-header {
            text-align: center;
            padding: 12px 8px 20px;
        }

        @media (min-width: 768px) {
            .app-header { padding: 20px 8px 28px; }
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
            line-height: 1.25;
        }

        @media (min-width: 768px) {
            .app-header h1 { font-size: 30px; }
        }

        .app-header .subtitle {
            color: var(--text-soft);
            font-size: 12px;
            padding: 0 8px;
            word-break: break-all;
            line-height: 1.5;
        }

        @media (min-width: 768px) {
            .app-header .subtitle { font-size: 14px; }
        }

        .app-header .subtitle a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent);
        }

        /* ============== Main grid ==============
           Mobile-first: always single column.
           Desktop (≥1024px): 340px input + 1fr results side by side.
           ====================================== */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            align-items: start;
            width: 100%;
            max-width: 100%;
        }

        @media (min-width: 1400px) {
            .main-grid {
                grid-template-columns: 360px 1fr;
                gap: 24px;
            }
        }

        .left-panel {
            width: 100%;
            max-width: 100%;
        }

        @media (min-width: 1400px) {
            .left-panel {
                position: sticky;
                top: 20px;
            }
        }

        /* ============== Input Panel ============== */
        .input-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow: hidden;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        @media (min-width: 768px) {
            .input-card {
                padding: 18px;
                border-radius: 12px;
            }
        }

        .input-card h2 {
            font-size: 15px;
            margin-bottom: 12px;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        @media (min-width: 768px) {
            .input-card h2 { font-size: 16px; margin-bottom: 16px; }
        }

        .field-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            max-width: 100%;
        }

        .field-row label {
            font-size: 12px;
            color: var(--text-soft);
            margin-bottom: 4px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .field-row input,
        .field-row select {
            background: var(--bg-elev);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 16px;  /* 16px prevents iOS auto-zoom on focus */
            font-family: 'JetBrains Mono', 'SF Mono', 'Source Code Pro', monospace;
            transition: border-color 0.15s;
            width: 100%;
            max-width: 100%;
            -webkit-appearance: none;
            appearance: none;
            min-height: 44px;
        }

        .field-row input:focus,
        .field-row select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .field-row input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .field-row small {
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 3px;
            line-height: 1.45;
            word-break: break-word;
            overflow-wrap: break-word;
            display: block;
        }

        .input-card hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 12px 0;
        }

        .primary-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.15s;
            margin-top: 8px;
            min-height: 48px;
            /* Allow text to wrap on very narrow screens — never truncate the label */
            white-space: normal;
            word-break: keep-all;
            overflow-wrap: break-word;
            font-family: inherit;
            line-height: 1.3;
        }

        .primary-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(212, 165, 116, 0.3);
        }

        .primary-btn:active {
            transform: translateY(0);
        }

        /* City presets — flex-wrap to wrap on small screens */
        .city-presets {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }

        .city-presets .preset-label {
            width: 100%;
            margin-bottom: 4px;
        }

        .preset-label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }

        .preset-btn {
            background: var(--bg-elev);
            color: var(--text-soft);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-block;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .preset-btn:hover, .preset-btn:active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        /* ============== Right Panel ============== */
        .placeholder {
            background: var(--bg-card);
            border: 1px dashed var(--border-soft);
            border-radius: 10px;
            padding: 40px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 100%;
        }

        @media (min-width: 768px) {
            .results-container { gap: 18px; }
        }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            box-shadow: var(--shadow);
            /* IMPORTANT: overflow: visible so .table-scroll inside can scroll
               horizontally without being clipped by the card. */
            overflow: visible;
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        @media (min-width: 768px) {
            .result-card {
                padding: 16px;
                border-radius: 12px;
            }
        }

        .result-card h2 {
            font-size: 15px;
            color: var(--accent);
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        @media (min-width: 768px) {
            .result-card h2 { font-size: 16px; }
        }

        .card-hint {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 10px;
            line-height: 1.55;
            word-break: break-word;
        }

        /* ============== Summary Grid — 2 cols on mobile, auto-fit on desktop ============== */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
        }

        @media (min-width: 600px) {
            .summary-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 10px;
            }
        }

        .summary-cell {
            background: var(--bg-elev);
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            min-width: 0;
            overflow: hidden;
        }

        .summary-cell strong {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            margin-bottom: 3px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .summary-cell span {
            font-size: 12px;
            color: var(--text);
            font-family: 'JetBrains Mono', 'SF Mono', 'Source Code Pro', monospace;
            word-break: break-all;
            display: block;
        }

        /* ============== Table horizontal scroll wrapper ==============
           Generated by Main.kt wrapping each <table> in <div class="table-scroll">.
           Allows horizontal pan within the wrapper without breaking the page. */
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            max-width: 100%;
            margin: 0 -4px;
            padding: 0 4px;
            /* Allow horizontal panning inside this element */
            touch-action: pan-x pan-y;
            overscroll-behavior-x: contain;
        }

        .kp-table,
        .sig-table,
        .rp-table {
            border-collapse: collapse;
            font-size: 13px;
            /* No min-width — let tables size to content, scroll horizontally if needed */
            width: max-content;
            max-width: none;
        }

        .kp-table th,
        .kp-table td,
        .sig-table th,
        .sig-table td,
        .rp-table th,
        .rp-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .kp-table th,
        .sig-table th,
        .rp-table th {
            background: var(--bg-elev);
            color: var(--text-soft);
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.3px;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .kp-table td,
        .sig-table td,
        .rp-table td {
            font-family: 'JetBrains Mono', 'SF Mono', 'Source Code Pro', monospace;
        }

        .kp-table tr:hover td,
        .sig-table tr:hover td,
        .rp-table tr:hover td {
            background: var(--bg-card-hover);
        }

        .kp-num { color: var(--accent); font-weight: 700; }

        .promise-positive,
        .promise-negative,
        .promise-mixed {
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            white-space: nowrap;
        }
        .promise-positive { color: var(--positive); background: rgba(74, 222, 128, 0.1); }
        .promise-negative { color: var(--negative); background: rgba(248, 113, 113, 0.1); }
        .promise-mixed { color: var(--mixed); background: rgba(250, 204, 21, 0.1); }

        .sig-detail {
            line-height: 2;
            white-space: normal;
        }

        /* ============== Mobile-first Card Layout (v1.3) ==============
           Replaces wide tables with stacked card grids.
           Each card represents one data item (planet / house / event).
           Cards naturally wrap to fit any phone screen width. */

        .item-card-grid {
            display: grid;
            grid-template-columns: 1fr;     /* mobile: single column */
            gap: 8px;
            width: 100%;
        }

        @media (min-width: 480px) {
            .item-card-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }

        @media (min-width: 900px) {
            .item-card-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
        }

        .item-card {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            min-width: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-card-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .item-card-symbol {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            color: var(--bg);
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
            font-family: 'PingFang SC', sans-serif;
        }

        .item-card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-card-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--accent);
            border: 1px solid var(--border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .item-card-tag.promise-positive {
            background: rgba(74, 222, 128, 0.15);
            color: var(--positive);
            border-color: var(--positive);
        }

        .item-card-tag.promise-negative {
            background: rgba(248, 113, 113, 0.15);
            color: var(--negative);
            border-color: var(--negative);
        }

        .item-card-tag.promise-mixed {
            background: rgba(250, 204, 21, 0.15);
            color: var(--mixed);
            border-color: var(--mixed);
        }

        /* data-grid: 2-col mini-grid of label:value pairs inside each card */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px 8px;
        }

        .data-cell {
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 3px 0;
        }

        .data-label {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            margin-bottom: 1px;
            white-space: nowrap;
        }

        .data-value {
            font-size: 12px;
            color: var(--text);
            font-family: 'JetBrains Mono', 'SF Mono', 'Source Code Pro', monospace;
            word-break: break-all;
            line-height: 1.4;
        }

        .data-value.kp-num {
            color: var(--accent);
            font-weight: 700;
        }

        /* Significator card layout */
        .sig-card .sig-houses {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            min-height: 24px;
            align-items: center;
        }

        .sig-card .house-empty {
            color: var(--text-muted);
            font-size: 11px;
            font-style: italic;
        }

        .sig-card .sig-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            line-height: 1.6;
        }

        /* Ruling planets — compact grid */
        .rp-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
        }

        @media (min-width: 600px) {
            .rp-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 8px;
            }
        }

        .rp-card {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            min-width: 0;
        }

        .rp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .rp-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .rp-count {
            font-size: 12px;
            color: var(--accent);
            font-weight: 700;
            font-family: 'JetBrains Mono', 'Source Code Pro', monospace;
        }

        /* Override: summary-grid 1 col on tiny phones, 2 on small, auto-fit on tablet+ */
        .summary-grid {
            grid-template-columns: 1fr !important;
        }

        @media (min-width: 400px) {
            .summary-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }

        @media (min-width: 768px) {
            .summary-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) !important;
            }
        }

        /* Override: event-grid 1 col on tiny phones, 2 on small, auto-fit on tablet+ */
        .event-grid {
            grid-template-columns: 1fr !important;
        }

        @media (min-width: 400px) {
            .event-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }

        @media (min-width: 768px) {
            .event-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)) !important;
            }
        }

        /* Override: house-grid 1 col on tiny phones, 2 on small, auto-fit on tablet+ */
        .house-grid {
            grid-template-columns: 1fr !important;
        }

        @media (min-width: 400px) {
            .house-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }

        @media (min-width: 768px) {
            .house-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) !important;
            }
        }

        /* Hide old table styles — kept for backward compat but no longer rendered */
        .table-scroll { display: none; }
        .kp-table, .sig-table, .rp-table, .cuspal-table { display: none; }

        .house-chip,
        .sig-grade {
            display: inline-block;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'JetBrains Mono', 'Source Code Pro', monospace;
            margin: 2px 2px 2px 0;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .house-chip {
            background: var(--bg-elev);
            color: var(--text);
            padding: 2px 8px;
            border-color: var(--border);
        }

        .sig-grade { padding: 2px 6px; }
        .sig-grade-starlord { background: rgba(245, 158, 11, 0.15); color: var(--grade-a); border-color: var(--grade-a); }
        .sig-grade-occupant { background: rgba(96, 165, 250, 0.15); color: var(--grade-b); border-color: var(--grade-b); }
        .sig-grade-owner { background: rgba(52, 211, 153, 0.15); color: var(--grade-d); border-color: var(--grade-d); }
        .sig-grade-aspecting { background: rgba(148, 163, 184, 0.15); color: var(--grade-e); border-color: var(--grade-e); }

        .strength-bar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .strength-dot { color: var(--accent); font-size: 16px; }

        /* ============== Event Grid — single col on small mobile ============== */
        .event-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        @media (min-width: 600px) {
            .event-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 10px;
            }
        }

        .event-card {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            transition: transform 0.1s;
            min-width: 0;
        }

        .event-card:hover, .event-card:active { transform: translateY(-2px); }
        .event-promised { border-color: var(--positive); background: rgba(74, 222, 128, 0.05); }
        .event-denied { border-color: var(--negative); background: rgba(248, 113, 113, 0.05); }

        .event-icon { font-size: 20px; font-weight: 700; }
        .event-promised .event-icon { color: var(--positive); }
        .event-denied .event-icon { color: var(--negative); }

        .event-name { font-size: 13px; font-weight: 600; color: var(--text); }
        .event-status { font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }
        .event-promised .event-status { color: var(--positive); }
        .event-denied .event-status { color: var(--negative); }

        .event-detail {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            word-break: break-word;
            line-height: 1.4;
        }

        /* ============== House Grid ============== */
        .house-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        @media (min-width: 600px) {
            .house-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 8px;
            }
        }

        .house-card {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            min-width: 0;
        }

        .house-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .house-empty { color: var(--text-muted); font-size: 11px; font-style: italic; }

        .house-sig {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 6px;
            border-radius: 4px;
            margin-bottom: 2px;
            font-size: 11px;
            font-family: 'JetBrains Mono', 'Source Code Pro', monospace;
        }

        .house-sig-planet { font-weight: 700; }
        .house-sig-grade { font-size: 10px; opacity: 0.8; }
        .house-sig.sig-grade-starlord { background: rgba(245, 158, 11, 0.1); color: var(--grade-a); }
        .house-sig.sig-grade-occupant { background: rgba(96, 165, 250, 0.1); color: var(--grade-b); }
        .house-sig.sig-grade-owner { background: rgba(52, 211, 153, 0.1); color: var(--grade-d); }
        .house-sig.sig-grade-aspecting { background: rgba(148, 163, 184, 0.1); color: var(--grade-e); }

        /* ============== Notes ============== */
        .notes-card ul {
            list-style: none;
            padding: 0;
        }

        .notes-card li {
            padding: 6px 0 6px 20px;
            position: relative;
            color: var(--text-soft);
            font-size: 12px;
            line-height: 1.6;
            word-break: break-word;
        }

        @media (min-width: 768px) {
            .notes-card li { font-size: 13px; }
        }

        .notes-card li::before {
            content: "•";
            position: absolute;
            left: 4px;
            color: var(--accent);
            font-weight: 700;
        }

        .notes-card a {
            color: var(--accent);
            word-break: break-all;
        }

        /* ============== Error ============== */
        .error-card {
            background: var(--bg-card);
            border: 1px solid var(--negative);
            border-radius: 10px;
            padding: 16px;
            color: var(--negative);
        }

        .error-card pre {
            background: var(--bg-elev);
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 11px;
            overflow-x: auto;
            color: var(--text-soft);
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ==================================================================
           Native Android Bridge — Floating FAB at bottom-right
           Collapsed by default, expands to a panel on tap.
           ================================================================== */
        .bridge-fab {
            position: fixed;
            bottom: calc(20px + var(--safe-b));
            right: calc(16px + var(--safe-r));
            z-index: 10000;
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            color: var(--bg);
            border: none;
            border-radius: 28px;
            width: 56px;
            height: 56px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            line-height: 1;
        }

        .bridge-fab.visible { display: inline-flex; }

        .bridge-fab .fab-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--positive);
            box-shadow: 0 0 6px var(--positive);
            border: 2px solid var(--bg-card);
        }

        .bridge-fab.analytical .fab-dot {
            background: var(--mixed);
            box-shadow: 0 0 6px var(--mixed);
        }

        .bridge-panel {
            position: fixed;
            bottom: calc(84px + var(--safe-b));
            right: calc(12px + var(--safe-r));
            left: calc(12px + var(--safe-l));
            max-width: 380px;
            margin-left: auto;
            max-height: calc(70vh - var(--safe-t) - var(--safe-b));
            overflow-y: auto;
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 9999;
            font-size: 13px;
            display: none;
            -webkit-overflow-scrolling: touch;
        }

        @media (min-width: 600px) {
            .bridge-panel {
                left: auto;
                width: 360px;
            }
        }

        .bridge-panel.visible { display: block; }

        .bridge-panel h3 {
            font-size: 15px;
            color: var(--accent);
            margin: 0 0 10px 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bridge-panel .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            min-width: 32px;
            min-height: 32px;
            font-family: inherit;
        }

        .bridge-status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            color: var(--text-soft);
            gap: 8px;
            font-size: 12px;
        }

        .bridge-status-row strong {
            color: var(--text);
            text-align: right;
            word-break: break-all;
            font-family: 'JetBrains Mono', 'Source Code Pro', monospace;
            font-size: 11px;
            max-width: 70%;
        }

        .bridge-status-source {
            background: rgba(74, 222, 128, 0.15);
            color: var(--positive);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Source Code Pro', monospace;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .bridge-status-source.analytical {
            background: rgba(250, 204, 21, 0.15);
            color: var(--mixed);
        }

        .bridge-path-row {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 8px;
            margin: 6px 0;
            font-family: 'JetBrains Mono', 'Source Code Pro', monospace;
            font-size: 10px;
            color: var(--text-muted);
            word-break: break-all;
            line-height: 1.4;
        }

        .bridge-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .bridge-btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 9px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            min-width: 80px;
            min-height: 40px;
            font-family: inherit;
        }

        .bridge-btn.secondary {
            background: var(--bg-elev);
            color: var(--text-soft);
            border: 1px solid var(--border);
        }

        .bridge-btn.danger {
            background: rgba(248, 113, 113, 0.15);
            color: var(--negative);
            border: 1px solid var(--negative);
        }

        .bridge-btn:hover, .bridge-btn:active { opacity: 0.9; }
        .bridge-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Pause/resume/stop state colors (v1.3) */
        .bridge-btn.pause-state {
            background: rgba(250, 204, 21, 0.9);
            color: var(--bg);
            border: 1px solid var(--mixed);
        }
        .bridge-btn.danger.stop-state {
            background: rgba(248, 113, 113, 0.95);
            color: #fff;
            border: 1px solid var(--negative);
            font-weight: 700;
        }

        /* Download progress bar */
        .bridge-progress {
            margin-top: 10px;
            display: none;
        }
        .bridge-progress.visible { display: block; }

        .bridge-progress-label {
            font-size: 11px;
            color: var(--text-soft);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .bridge-progress-bar {
            height: 8px;
            background: var(--bg-elev);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .bridge-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-soft));
            width: 0%;
            transition: width 0.3s;
        }

        .bridge-test-area {
            margin-top: 10px;
            background: var(--bg-elev);
            border-radius: 6px;
            padding: 8px;
            font-family: 'JetBrains Mono', 'Source Code Pro', monospace;
            font-size: 10px;
            max-height: 240px;
            overflow-y: auto;
            display: none;
            color: var(--text-soft);
            -webkit-overflow-scrolling: touch;
        }

        .bridge-test-area.visible { display: block; }

        .bridge-test-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px dotted var(--border);
            gap: 6px;
        }

        .bridge-test-row span:first-child {
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .bridge-test-row span:last-child {
            text-align: right;
            word-break: break-all;
        }

        .bridge-help {
            margin-top: 10px;
            padding: 8px;
            background: rgba(212, 165, 116, 0.08);
            border-left: 3px solid var(--accent);
            font-size: 11px;
            color: var(--text-soft);
            line-height: 1.55;
            border-radius: 0 4px 4px 0;
        }

        /* ============== v2.0 新增 ============== */

        /* Tab 导航 */
        .tab-nav {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding: 0 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .tab-btn {
            background: transparent;
            color: var(--text-soft);
            border: none;
            border-bottom: 2px solid transparent;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: color 0.2s, border-color 0.2s;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* Tab 内容 */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* 按钮行 */
        .button-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .secondary-btn {
            background: var(--bg-elev);
            color: var(--text-soft);
            border: 1px solid var(--border);
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            flex: 1;
            min-width: 100px;
        }
        .secondary-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text);
        }

        /* 行星逆行 / 庙旺 标签 */
        .retro-tag {
            background: rgba(248, 113, 113, 0.2) !important;
            color: var(--negative) !important;
            font-weight: 700;
        }
        .virtual-tag {
            background: rgba(167, 139, 250, 0.25) !important;
            color: #a78bfa !important;
        }
        .virtual-moon {
            border: 1px solid #a78bfa !important;
            box-shadow: 0 0 8px rgba(167, 139, 250, 0.2);
        }

        /* 行星庙旺色 */
        .dignity-exalted     { background: rgba(245, 158, 11, 0.25); color: #f59e0b; }
        .dignity-moolatrikona { background: rgba(96, 165, 250, 0.25); color: #60a5fa; }
        .dignity-ownsign     { background: rgba(52, 211, 153, 0.25); color: #34d399; }
        .dignity-greatfriend { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
        .dignity-friend      { background: rgba(74, 222, 128, 0.10); color: #4ade80; }
        .dignity-neutral     { background: var(--bg-elev); color: var(--text-muted); }
        .dignity-enemy       { background: rgba(248, 113, 113, 0.15); color: var(--negative); }
        .dignity-greatenemy  { background: rgba(248, 113, 113, 0.20); color: var(--negative); }
        .dignity-debilitated { background: rgba(248, 113, 113, 0.30); color: var(--negative); font-weight: 700; }

        /* Dasha 时间轴 */
        .dasha-timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .dasha-maha {
            background: var(--bg-card);
            border-left: 4px solid var(--accent);
            border-radius: 6px;
            padding: 12px;
        }
        .dasha-maha-header {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .dasha-maha-header .dasha-lord-name {
            font-weight: 700;
            color: var(--accent);
            font-size: 16px;
            min-width: 60px;
        }
        .dasha-maha-header .dasha-period {
            color: var(--text-soft);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }
        .dasha-maha-header .dasha-duration {
            color: var(--text-muted);
            font-size: 12px;
            margin-left: auto;
        }
        .dasha-antars {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 16px;
            border-left: 1px dotted var(--border);
            margin-left: 8px;
        }
        .dasha-antar {
            background: var(--bg-elev);
            border-left: 2px solid var(--accent-soft);
            border-radius: 4px;
            padding: 8px 10px;
            font-size: 12px;
        }
        .dasha-antar-header {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .dasha-antar-header .dasha-lord-name {
            font-weight: 600;
            color: var(--accent-soft);
            min-width: 50px;
        }
        .dasha-antar-header .dasha-period {
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }
        .dasha-pratyantars {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-left: 12px;
            border-left: 1px dotted var(--border-soft);
            margin-left: 8px;
        }
        .dasha-pratyantar {
            display: flex;
            gap: 8px;
            font-size: 11px;
            color: var(--text-muted);
            padding: 3px 6px;
            border-radius: 3px;
        }
        .dasha-pratyantar:hover {
            background: var(--bg-card-hover);
        }
        .dasha-pratyantar .dasha-lord-name {
            color: var(--text-soft);
            min-width: 40px;
        }
        .dasha-pratyantar .dasha-period {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Dasha 颜色：每个 DashaLord 一种主题色 */
        .dasha-lord-ketu     { border-left-color: #a855f7; }
        .dasha-lord-venus    { border-left-color: #f59e0b; }
        .dasha-lord-sun      { border-left-color: #ef4444; }
        .dasha-lord-moon     { border-left-color: #94a3b8; }
        .dasha-lord-mars     { border-left-color: #dc2626; }
        .dasha-lord-rahu     { border-left-color: #6366f1; }
        .dasha-lord-jupiter  { border-left-color: #fbbf24; }
        .dasha-lord-saturn   { border-left-color: #3b82f6; }
        .dasha-lord-mercury  { border-left-color: #10b981; }

        /* 当前 Dasha 显示 */
        .current-dasha {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .dasha-row {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 14px;
            padding: 8px;
            background: var(--bg-elev);
            border-radius: 6px;
        }
        .dasha-row strong {
            color: var(--accent);
            min-width: 60px;
        }

        /* 调试面板 */
        .debug-section {
            margin-top: 12px;
        }
        .debug-section h3 {
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .field-row.compact {
            margin-bottom: 4px;
        }
        .field-row.compact label {
            min-width: 80px;
            font-size: 12px;
        }
        .field-row.compact input {
            padding: 5px 8px;
            font-size: 12px;
        }
        .field-row.compact small {
            color: var(--text-muted);
            font-size: 10px;
        }
        .debug-output {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-soft);
            max-height: 400px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .debug-lines {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .debug-line {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 3px 0;
            border-bottom: 1px dotted var(--border);
        }
        .debug-line hr {
            margin: 8px 0;
            border: none;
            border-top: 1px dashed var(--border);
        }
        .debug-key {
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .debug-val {
            color: var(--accent);
            text-align: right;
            word-break: break-all;
            font-weight: 600;
        }

        /* Horary 面板 */
        .horary-result {
            margin-top: 12px;
        }
        .rp-summary {
            background: var(--bg-elev);
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
        }
        .rp-summary h3 {
            color: var(--accent);
            font-size: 13px;
            margin-bottom: 8px;
        }
        .rp-grid.compact {
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 4px;
        }
        .rp-grid.compact .rp-card {
            padding: 6px 8px;
            font-size: 12px;
        }

        /* 错误卡片 */
        .error-card {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid var(--negative);
            border-radius: 6px;
            padding: 16px;
            margin: 16px 0;
        }
        .error-card h3 {
            color: var(--negative);
            margin-bottom: 8px;
        }
        .error-card pre {
            color: var(--text);
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }

<body>
    <div id="app">正在加载 KP 占星……</div>

    <!-- Native Android DE440S bridge — FAB (collapsed by default) -->
    <button id="bridge-fab" class="bridge-fab" aria-label="星历桥接">
        <span class="fab-dot"></span>
        <span>★</span>
    </button>

    <!-- Bridge panel (hidden until FAB tapped) -->
    <div id="bridge-panel" class="bridge-panel" role="dialog" aria-label="原生星历桥接">
        <h3>
            <span>原生星历桥接</span>
            <button type="button" class="close-btn" id="bridge-close-btn" aria-label="关闭">×</button>
        </h3>
        <div class="bridge-status-row">
            <span>数据源：</span>
            <strong id="bridge-source" class="bridge-status-source analytical">解析法</strong>
        </div>
        <div class="bridge-status-row">
            <span>DE440S 文件：</span>
            <strong id="bridge-file">未加载</strong>
        </div>
        <div class="bridge-status-row">
            <span>文件大小：</span>
            <strong id="bridge-filesize">—</strong>
        </div>
        <div class="bridge-path-row" id="bridge-path">
            路径：—
        </div>

        <div class="bridge-actions">
            <button type="button" class="bridge-btn" id="bridge-download-btn">下载 DE440S</button>
            <button type="button" class="bridge-btn secondary" id="bridge-load-btn">选择文件</button>
            <button type="button" class="bridge-btn secondary" id="bridge-test-btn">验证</button>
        </div>
        <div class="bridge-actions">
            <button type="button" class="bridge-btn secondary" id="bridge-unload-btn">卸载</button>
            <button type="button" class="bridge-btn danger" id="bridge-delete-btn">删除文件</button>
        </div>

        <div id="bridge-progress" class="bridge-progress">
            <div class="bridge-progress-label">
                <span id="bridge-progress-text">下载中…</span>
                <span id="bridge-progress-pct">0%</span>
            </div>
            <div class="bridge-progress-bar">
                <div id="bridge-progress-fill" class="bridge-progress-fill"></div>
            </div>
        </div>

        <div id="bridge-test" class="bridge-test-area"></div>

        <div class="bridge-help">
            <strong>说明：</strong>
            应用启动时自动读取 <code>Android/data/com.xalen.kpastro/files/ephemeris/de440s.bsp</code>。
            若文件不存在，可点「下载 DE440S」从 NASA JPL 下载（约 32 MB），
            或点「选择文件」手动导入。下载完成后下次启动自动加载。
        </div>
    </div>

    <!-- Kotlin/JS UMD dependencies — must be loaded BEFORE kp-astro.js.
         kp-astro.js throws at load time if globalThis['kotlin-kotlin-stdlib']
         or globalThis['kotlinx-html'] are not yet defined. -->
    <script src="kotlin-kotlin-stdlib.js"></script>
    <script src="kotlinx-html.js"></script>
    <script>
        // Surface any script-loading / runtime errors visibly so the user
        // does not need to open remote debugging to know what went wrong.
        window.addEventListener('error', function(e) {
            var msg = (e && e.message) ? e.message : ('' + e);
            console.error('[window.onerror]', msg, e);
            var el = document.getElementById('app');
            if (el && (!el.innerHTML || el.innerHTML.indexOf('正在加载') !== -1
                       || el.innerHTML.indexOf('Kotlin/JS 模块加载失败') !== -1)) {
                el.innerHTML =
                    '<div style="padding:32px;text-align:center;color:#f87171;font-family:monospace;font-size:13px;line-height:1.6;">' +
                    '<div style="font-weight:600;margin-bottom:8px;">页面脚本运行出错</div>' +
                    '<div style="word-break:break-all;white-space:pre-wrap;">' +
                    String(msg).replace(/</g, '&lt;') +
                    '</div></div>';
            }
        });
    </script>
    <script src="kp-astro.js"></script>
    <script>
        // kp-astro.js is a UMD bundle. The @JsExport top-level functions
        // (initApp, setupAyanamsaToggle) are attached to globalThis["kp-astro"].kp.astro
        function startKpApp() {
            var mod = window["kp-astro"];
            var initFn = null;
            if (mod) {
                if (typeof mod.initApp === 'function') initFn = mod.initApp;
                else if (mod.kp && mod.kp.astro && typeof mod.kp.astro.initApp === 'function') initFn = mod.kp.astro.initApp;
            }
            if (initFn) {
                try {
                    initFn();
                } catch (err) {
                    console.error('[startKpApp] initApp threw:', err);
                    document.getElementById('app').innerHTML =
                        '<div style="padding:32px;text-align:center;color:#f87171;font-family:monospace;font-size:13px;line-height:1.6;">' +
                        '<div style="font-weight:600;margin-bottom:8px;">initApp 运行出错</div>' +
                        '<div style="word-break:break-all;white-space:pre-wrap;">' +
                        String(err && err.message ? err.message : err).replace(/</g, '&lt;') +
                        '</div></div>';
                }
            } else {
                var diag = 'mod=' + (mod === undefined ? 'undefined' :
                          (mod === null ? 'null' : (typeof mod)));
                if (mod && typeof mod === 'object') {
                    diag += ' keys=[' + Object.keys(mod).join(',') + ']';
                }
                var stdlib = typeof globalThis['kotlin-kotlin-stdlib'];
                var html   = typeof globalThis['kotlinx-html'];
                diag += ' | stdlib=' + stdlib + ' html=' + html;
                document.getElementById('app').innerHTML =
                    '<div style="padding:32px;text-align:center;color:#f87171;font-family:monospace;font-size:13px;line-height:1.6;">' +
                    '<div style="font-weight:600;margin-bottom:8px;">Kotlin/JS 模块加载失败</div>' +
                    '<div style="word-break:break-all;">' + diag + '</div>' +
                    '<div style="margin-top:8px;color:#94a3b8;font-size:12px;">请检查 kotlin-kotlin-stdlib.js 与 kotlinx-html.js 是否存在且先于 kp-astro.js 加载。</div>' +
                    '</div>';
                console.error('未找到 kp-astro.initApp，', diag);
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startKpApp);
        } else {
            startKpApp();
        }

        // ==================================================================
        // Native Android DE440S bridge integration
        // ==================================================================
        (function() {
            var fab       = document.getElementById('bridge-fab');
            var panel     = document.getElementById('bridge-panel');
            var closeBtn  = document.getElementById('bridge-close-btn');
            var sourceEl  = document.getElementById('bridge-source');
            var fileEl    = document.getElementById('bridge-file');
            var filesizeEl= document.getElementById('bridge-filesize');
            var pathEl    = document.getElementById('bridge-path');
            var testArea  = document.getElementById('bridge-test');
            var loadBtn   = document.getElementById('bridge-load-btn');
            var unloadBtn = document.getElementById('bridge-unload-btn');
            var testBtn   = document.getElementById('bridge-test-btn');
            var dlBtn     = document.getElementById('bridge-download-btn');
            var delBtn    = document.getElementById('bridge-delete-btn');
            var progWrap  = document.getElementById('bridge-progress');
            var progText  = document.getElementById('bridge-progress-text');
            var progPct   = document.getElementById('bridge-progress-pct');
            var progFill  = document.getElementById('bridge-progress-fill');

            function isBridgeAvailable() {
                return typeof window.De440Bridge !== 'undefined' &&
                       typeof window.De440Bridge.computeChart === 'function';
            }

            function refreshBridgeInfo() {
                if (!isBridgeAvailable()) return;
                try {
                    var info = JSON.parse(window.De440Bridge.getDe440Info());
                    var loaded = info.loaded === true;
                    if (loaded) {
                        sourceEl.textContent = 'DE440S 高精度';
                        sourceEl.classList.remove('analytical');
                        fab.classList.remove('analytical');
                        fileEl.textContent = info.fileName || 'de440s.bsp';
                        filesizeEl.textContent = (info.fileSizeMB || 0).toFixed(1) + ' MB';
                    } else {
                        sourceEl.textContent = '解析法 VSOP87';
                        sourceEl.classList.add('analytical');
                        fab.classList.add('analytical');
                        fileEl.textContent = info.fileExists ? '文件存在但未加载' : '未加载';
                        filesizeEl.textContent = info.fileExists ? '—' : '—';
                    }
                    if (info.error) {
                        fileEl.textContent = '错误：' + info.error;
                    }
                    if (info.storagePath) {
                        pathEl.textContent = '路径：' + info.storagePath;
                    }
                } catch (e) {
                    console.error('bridge info error', e);
                }
            }

            function showFab() {
                if (isBridgeAvailable()) {
                    fab.classList.add('visible');
                    refreshBridgeInfo();
                }
            }

            function togglePanel(forceOpen) {
                if (forceOpen === true) panel.classList.add('visible');
                else if (forceOpen === false) panel.classList.remove('visible');
                else panel.classList.toggle('visible');
            }

            fab.addEventListener('click', function(e) {
                e.stopPropagation();
                togglePanel();
            });
            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                togglePanel(false);
            });
            document.addEventListener('click', function(e) {
                if (!panel.classList.contains('visible')) return;
                if (panel.contains(e.target) || fab.contains(e.target)) return;
                togglePanel(false);
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && panel.classList.contains('visible')) {
                    togglePanel(false);
                }
            });

            // Poll for status updates (DE440S loads async, downloads update progress)
            var pollHandle = setInterval(function() {
                if (isBridgeAvailable()) {
                    refreshBridgeInfo();
                    updateBridgeButtons();
                }
            }, 800);

            loadBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isBridgeAvailable()) window.De440Bridge.pickDe440File();
            });
            unloadBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isBridgeAvailable()) {
                    window.De440Bridge.unloadDe440();
                    setTimeout(refreshBridgeInfo, 100);
                }
            });
            testBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (!isBridgeAvailable()) return;
                testArea.classList.add('visible');
                testArea.innerHTML = '<div style="color:var(--text-muted)">正在验证……</div>';
                setTimeout(runVerification, 50);
            });

            // ============== State-aware Download / Pause / Resume / Stop ==============
            // The download button morphs based on state:
            //   file not present + idle     → "下载 DE440S"
            //   file present + loaded       → "已加载"  (disabled-looking)
            //   file present + not loaded   → "已下载"  (click to load)
            //   downloading                  → "暂停"
            //   paused                       → "继续"
            // The delete button morphs based on state:
            //   downloading or paused       → "停止"
            //   idle / done / error         → "删除文件"

            function getBridgeState() {
                if (!isBridgeAvailable()) return { mode: 'no-bridge', fileExists: false, loaded: false, dl: { status: 'idle' } };
                try {
                    var info = JSON.parse(window.De440Bridge.getDe440Info());
                    var dl = JSON.parse(window.De440Bridge.getDownloadStatus());
                    return {
                        mode: 'ok',
                        fileExists: !!info.fileExists,
                        loaded: !!info.loaded,
                        dl: dl
                    };
                } catch (e) {
                    return { mode: 'error', fileExists: false, loaded: false, dl: { status: 'idle' } };
                }
            }

            function updateBridgeButtons() {
                var s = getBridgeState();
                var dlStatus = s.dl.status;   // idle | downloading | paused | done | error

                if (dlStatus === 'downloading') {
                    dlBtn.textContent = '暂停';
                    dlBtn.classList.add('pause-state');
                    dlBtn.disabled = false;
                    delBtn.textContent = '停止';
                    delBtn.classList.add('stop-state');
                    progWrap.classList.add('visible');
                } else if (dlStatus === 'paused') {
                    dlBtn.textContent = '继续';
                    dlBtn.classList.add('pause-state');
                    dlBtn.disabled = false;
                    delBtn.textContent = '停止';
                    delBtn.classList.add('stop-state');
                    progWrap.classList.add('visible');
                } else {
                    dlBtn.classList.remove('pause-state');
                    delBtn.classList.remove('stop-state');
                    if (s.loaded) {
                        dlBtn.textContent = '已加载';
                        dlBtn.disabled = true;
                    } else if (s.fileExists) {
                        dlBtn.textContent = '已下载 · 点击加载';
                        dlBtn.disabled = false;
                    } else {
                        dlBtn.textContent = '下载 DE440S';
                        dlBtn.disabled = false;
                    }
                    delBtn.textContent = '删除文件';
                    if (dlStatus === 'done') {
                        progWrap.classList.add('visible');
                    } else if (dlStatus === 'error') {
                        progWrap.classList.add('visible');
                    } else {
                        // idle — hide progress after a delay
                    }
                }

                // Update progress bar based on download status
                if (dlStatus === 'downloading' || dlStatus === 'paused') {
                    var pct = s.dl.percent || 0;
                    if (s.dl.total > 0) {
                        progPct.textContent = pct.toFixed(1) + '%';
                    } else if (s.dl.received > 0) {
                        progPct.textContent = (s.dl.received / (1024*1024)).toFixed(1) + ' MB';
                    } else {
                        progPct.textContent = '0%';
                    }
                    progFill.style.width = Math.min(100, pct) + '%';
                    var mbRcv = (s.dl.received / (1024*1024)).toFixed(1);
                    var mbTot = s.dl.total > 0 ? ' / ' + (s.dl.total / (1024*1024)).toFixed(1) + ' MB' : ' MB';
                    progText.textContent = (dlStatus === 'paused' ? '已暂停 · ' : '下载中… ') + mbRcv + mbTot;
                } else if (dlStatus === 'done') {
                    progText.textContent = '下载完成，已自动加载 DE440S';
                    progPct.textContent = '100%';
                    progFill.style.width = '100%';
                    setTimeout(function() { progWrap.classList.remove('visible'); }, 3000);
                } else if (dlStatus === 'error') {
                    progText.textContent = '下载失败：' + (s.dl.error || '未知错误');
                    progPct.textContent = '错误';
                } else if (dlStatus === 'idle') {
                    // Only hide if no recent activity
                    if (progText.textContent.indexOf('下载完成') === -1 && progText.textContent.indexOf('失败') === -1) {
                        progWrap.classList.remove('visible');
                    }
                }
            }

            dlBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (!isBridgeAvailable()) return;
                var s = getBridgeState();
                var dlStatus = s.dl.status;

                if (dlStatus === 'downloading') {
                    // → pause
                    window.De440Bridge.pauseDownload();
                } else if (dlStatus === 'paused') {
                    // → resume
                    window.De440Bridge.resumeDownload();
                } else if (s.fileExists && !s.loaded) {
                    // → load the existing file
                    window.De440Bridge.autoLoadDe440();
                    setTimeout(refreshBridgeInfo, 200);
                } else if (!s.fileExists) {
                    // → start fresh download
                    var ok = window.De440Bridge.downloadDe440('');
                    if (!ok) {
                        progWrap.classList.add('visible');
                        progText.textContent = '已有下载进行中，请稍候…';
                        return;
                    }
                    progWrap.classList.add('visible');
                    progText.textContent = '开始下载…';
                    progPct.textContent = '0%';
                    progFill.style.width = '0%';
                }
                // If already loaded, button is disabled — no action
                setTimeout(updateBridgeButtons, 100);
            });

            // Delete DE440S file (also serves as "Stop" during download)
            delBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (!isBridgeAvailable()) return;
                var s = getBridgeState();
                var dlStatus = s.dl.status;

                if (dlStatus === 'downloading' || dlStatus === 'paused') {
                    // Stop the download — discards in-memory buffer, no file written
                    window.De440Bridge.stopDownload();
                    setTimeout(function() {
                        updateBridgeButtons();
                        refreshBridgeInfo();
                    }, 200);
                    return;
                }

                // Otherwise: delete the file
                if (!confirm('确认删除 Android/data/com.xalen.kpastro/files/ephemeris/ 下的 DE440S 文件？\n（应用将回退到解析法 VSOP87）')) return;
                var ok = window.De440Bridge.deleteDe440File();
                if (ok) {
                    window.De440Bridge.unloadDe440();
                    setTimeout(function() {
                        refreshBridgeInfo();
                        updateBridgeButtons();
                    }, 100);
                    alert('已删除。');
                } else {
                    alert('删除失败。');
                }
            });

            // ============== Verification ==============
            function runVerification() {
                var input = {
                    year: 2024, month: 1, day: 1, hour: 12.0,
                    lat: 28.6139, lon: 77.2090,
                    ayanamsa: 6.6685,
                    houseSystem: 'Placidus'
                };
                try {
                    var result = JSON.parse(window.De440Bridge.computeChart(JSON.stringify(input)));
                    if (result.error) {
                        testArea.innerHTML = '<div style="color:var(--negative)">错误：' + result.error + '</div>';
                        return;
                    }
                    var html = '<div style="color:var(--accent);font-weight:700;margin-bottom:4px">';
                    html += '数据源：' + result.source + '</div>';
                    html += '<div style="color:var(--text-muted);margin-bottom:4px">JD ' +
                            result.jd.toFixed(4) + ' · 2024-01-01 12:00 UT · 新德里 · KP 岁差 6°40\'06"</div>';
                    html += '<div style="color:var(--text-muted);margin-bottom:4px">上升（恒星）: ' +
                            result.ascendantSidereal.toFixed(4) + '° · 中天（恒星）: ' +
                            result.mcSidereal.toFixed(4) + '°</div>';
                    var planets = ['sun','moon','mercury','venus','mars','jupiter','saturn','rahu','ketu'];
                    var names = {sun:'日',moon:'月',mercury:'水',venus:'金',mars:'火',jupiter:'木',saturn:'土',rahu:'罗',ketu:'计'};
                    html += planets.map(function(p) {
                        var v = result.sidereal[p];
                        return '<div class="bridge-test-row"><span>' + (names[p]||p) + '</span>' +
                               '<span>' + (v != null ? v.toFixed(4) + '°' : '—') + '</span></div>';
                    }).join('');
                    testArea.innerHTML = html;
                } catch (e) {
                    testArea.innerHTML = '<div style="color:var(--negative)">错误：' + e.message + '</div>';
                }
            }

            // Show the FAB (not the panel) after page loads.
            if (document.readyState === 'complete') showFab();
            else window.addEventListener('load', showFab);

            // Expose for native callback (called from MainActivity.onPageFinished)
            window.onNativeBridgeReady = function() {
                showFab();
                if (typeof updateBridgeButtons === 'function') {
                    setTimeout(updateBridgeButtons, 100);
                }
            };

            // Auto-load DE440S from app external storage if present (called from MainActivity)
            window.autoLoadDe440 = function() {
                if (!isBridgeAvailable()) return;
                try {
                    var r = JSON.parse(window.De440Bridge.autoLoadDe440());
                    if (r.loaded) {
                        console.log('DE440S auto-loaded from storage:', r.fileName);
                    } else {
                        console.log('DE440S not present in storage; using analytical VSOP87');
                    }
                    refreshBridgeInfo();
                } catch (e) {
                    console.error('autoLoadDe440 failed', e);
                }
            };
        })();
    </script>
